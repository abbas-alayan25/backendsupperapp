name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-go@v6
        with:
          go-version-file: libs/go/common/go.mod
          cache-dependency-path: |
            libs/go/common/go.sum
            apps/**/go.sum
            tools/go/go.sum

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v4

      - run: pnpm check:versions

      - run: pnpm check:comments

      - if: github.event_name == 'pull_request'
        run: pnpm nx run proto:breaking

      - run: pnpm format:check

      - run: pnpm nx affected -t lint typecheck test build

      - run: pnpm nx affected -t test-integration --parallel=1

      - run: pnpm dev:smoke
