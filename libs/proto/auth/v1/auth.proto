syntax = "proto3";

package auth.v1;

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc VerifyStepUpToken(VerifyStepUpTokenRequest) returns (VerifyStepUpTokenResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (SetUserStatusResponse);
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
}

enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_CUSTOMER = 1;
  USER_TYPE_MERCHANT_STAFF = 2;
  USER_TYPE_RIDER = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_FROZEN = 3;
  USER_STATUS_BLOCKED = 4;
  USER_STATUS_CLOSED = 5;
}

message User {
  string id = 1;
  UserType user_type = 2;
  string first_name = 3;
  string last_name = 4;
  string locale = 5;
  UserStatus status = 6;
  int32 kyc_tier = 7;
  string referral_code = 8;
  google.protobuf.Timestamp last_login_at = 9;
  google.protobuf.Timestamp created_at = 10;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message BatchGetUsersResponse {
  repeated User users = 1;
}

message VerifyStepUpTokenRequest {
  string token = 1;
  string user_id = 2;
  string device_id = 3;
  string request_hash = 4;
}

message VerifyStepUpTokenResponse {
  bool valid = 1;
}

message SetUserStatusRequest {
  string user_id = 1;
  UserStatus status = 2;
  string reason = 3;
  string approval_request_id = 4;
}

message SetUserStatusResponse {
  User user = 1;
}

message RevokeSessionsRequest {
  string user_id = 1;
  string device_id = 2;
  string reason = 3;
}

message RevokeSessionsResponse {
  int32 revoked = 1;
}
