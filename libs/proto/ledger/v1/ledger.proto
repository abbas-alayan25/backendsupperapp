syntax = "proto3";

package ledger.v1;

import "common/v1/money.proto";
import "common/v1/page.proto";
import "google/protobuf/timestamp.proto";

service LedgerService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc PostEntry(PostEntryRequest) returns (PostEntryResponse);
  rpc ReverseEntry(ReverseEntryRequest) returns (ReverseEntryResponse);
  rpc CreateHold(CreateHoldRequest) returns (CreateHoldResponse);
  rpc CaptureHold(CaptureHoldRequest) returns (CaptureHoldResponse);
  rpc ReleaseHold(ReleaseHoldRequest) returns (ReleaseHoldResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc BatchGetBalances(BatchGetBalancesRequest) returns (BatchGetBalancesResponse);
  rpc ListPostings(ListPostingsRequest) returns (ListPostingsResponse);
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse);
}

enum OwnerType {
  OWNER_TYPE_UNSPECIFIED = 0;
  OWNER_TYPE_USER = 1;
  OWNER_TYPE_MERCHANT = 2;
  OWNER_TYPE_RIDER = 3;
  OWNER_TYPE_AGENT = 4;
  OWNER_TYPE_SYSTEM = 5;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_CUSTOMER_WALLET = 1;
  ACCOUNT_TYPE_MERCHANT_WALLET = 2;
  ACCOUNT_TYPE_RIDER_WALLET = 3;
  ACCOUNT_TYPE_AGENT_FLOAT = 4;
  ACCOUNT_TYPE_SAFEGUARDING = 5;
  ACCOUNT_TYPE_BANK_CLEARING = 6;
  ACCOUNT_TYPE_CARD_SETTLEMENT = 7;
  ACCOUNT_TYPE_FEE_INCOME = 8;
  ACCOUNT_TYPE_COMMISSION_INCOME = 9;
  ACCOUNT_TYPE_INTERCHANGE_INCOME = 10;
  ACCOUNT_TYPE_FX_POSITION = 11;
  ACCOUNT_TYPE_REWARDS_EXPENSE = 12;
  ACCOUNT_TYPE_PAYOUT_PAYABLE = 13;
  ACCOUNT_TYPE_BILLER_PAYABLE = 14;
  ACCOUNT_TYPE_COD_PAYABLE = 15;
  ACCOUNT_TYPE_SUSPENSE = 16;
}

enum NormalBalance {
  NORMAL_BALANCE_UNSPECIFIED = 0;
  NORMAL_BALANCE_DEBIT = 1;
  NORMAL_BALANCE_CREDIT = 2;
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_P2P = 1;
  ENTRY_TYPE_TOPUP = 2;
  ENTRY_TYPE_WITHDRAWAL = 3;
  ENTRY_TYPE_BILL_PAY = 4;
  ENTRY_TYPE_QR_PAY = 5;
  ENTRY_TYPE_ORDER_CAPTURE = 6;
  ENTRY_TYPE_CARD_CAPTURE = 7;
  ENTRY_TYPE_FEE = 8;
  ENTRY_TYPE_REFUND = 9;
  ENTRY_TYPE_REVERSAL = 10;
  ENTRY_TYPE_ADJUSTMENT = 11;
  ENTRY_TYPE_PAYOUT = 12;
  ENTRY_TYPE_FX = 13;
  ENTRY_TYPE_COD = 14;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_DEBIT = 1;
  DIRECTION_CREDIT = 2;
}

enum HoldReasonType {
  HOLD_REASON_TYPE_UNSPECIFIED = 0;
  HOLD_REASON_TYPE_CARD_AUTH = 1;
  HOLD_REASON_TYPE_ORDER = 2;
  HOLD_REASON_TYPE_WITHDRAWAL = 3;
  HOLD_REASON_TYPE_PAYMENT = 4;
}

enum HoldStatus {
  HOLD_STATUS_UNSPECIFIED = 0;
  HOLD_STATUS_ACTIVE = 1;
  HOLD_STATUS_CAPTURED = 2;
  HOLD_STATUS_RELEASED = 3;
  HOLD_STATUS_EXPIRED = 4;
}

message Account {
  string id = 1;
  string code = 2;
  OwnerType owner_type = 3;
  string owner_id = 4;
  AccountType account_type = 5;
  string currency = 6;
  NormalBalance normal_balance = 7;
  bool allow_negative = 8;
  string status = 9;
}

message Balance {
  string account_id = 1;
  common.v1.Money posted = 2;
  common.v1.Money held = 3;
  common.v1.Money available = 4;
  string last_entry_id = 5;
}

message PostingLine {
  string account_id = 1;
  Direction direction = 2;
  common.v1.Money amount = 3;
}

message Posting {
  string id = 1;
  string entry_id = 2;
  string account_id = 3;
  Direction direction = 4;
  common.v1.Money amount = 5;
  int64 balance_after_minor = 6;
  google.protobuf.Timestamp created_at = 7;
}

message Entry {
  string id = 1;
  EntryType entry_type = 2;
  string reference_type = 3;
  string reference_id = 4;
  string description = 5;
  string idempotency_key = 6;
  string reverses_entry_id = 7;
  google.protobuf.Timestamp effective_at = 8;
  string posted_by = 9;
  string approval_request_id = 10;
  repeated Posting postings = 11;
  google.protobuf.Timestamp created_at = 12;
}

message Hold {
  string id = 1;
  string account_id = 2;
  common.v1.Money amount = 3;
  HoldReasonType reason_type = 4;
  string reference_id = 5;
  HoldStatus status = 6;
  google.protobuf.Timestamp expires_at = 7;
  string captured_entry_id = 8;
}

message CreateAccountRequest {
  string code = 1;
  OwnerType owner_type = 2;
  string owner_id = 3;
  AccountType account_type = 4;
  string currency = 5;
  NormalBalance normal_balance = 6;
  bool allow_negative = 7;
}

message CreateAccountResponse {
  Account account = 1;
}

message PostEntryRequest {
  EntryType entry_type = 1;
  string reference_type = 2;
  string reference_id = 3;
  string description = 4;
  string idempotency_key = 5;
  google.protobuf.Timestamp effective_at = 6;
  string posted_by = 7;
  string approval_request_id = 8;
  repeated PostingLine lines = 9;
}

message PostEntryResponse {
  Entry entry = 1;
  repeated Balance balances = 2;
}

message ReverseEntryRequest {
  string entry_id = 1;
  string idempotency_key = 2;
  string description = 3;
  string posted_by = 4;
  string approval_request_id = 5;
}

message ReverseEntryResponse {
  Entry entry = 1;
}

message CreateHoldRequest {
  string account_id = 1;
  common.v1.Money amount = 2;
  HoldReasonType reason_type = 3;
  string reference_id = 4;
  google.protobuf.Timestamp expires_at = 5;
  string idempotency_key = 6;
}

message CreateHoldResponse {
  Hold hold = 1;
  Balance balance = 2;
}

message CaptureHoldRequest {
  string hold_id = 1;
  common.v1.Money amount = 2;
  EntryType entry_type = 3;
  string reference_type = 4;
  string reference_id = 5;
  string description = 6;
  repeated PostingLine lines = 7;
  string idempotency_key = 8;
}

message CaptureHoldResponse {
  Hold hold = 1;
  Entry entry = 2;
}

message ReleaseHoldRequest {
  string hold_id = 1;
  string idempotency_key = 2;
}

message ReleaseHoldResponse {
  Hold hold = 1;
  Balance balance = 2;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  Balance balance = 1;
}

message BatchGetBalancesRequest {
  repeated string account_ids = 1;
}

message BatchGetBalancesResponse {
  repeated Balance balances = 1;
}

message ListPostingsRequest {
  string account_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  common.v1.PageRequest page = 4;
}

message ListPostingsResponse {
  repeated Posting postings = 1;
  common.v1.PageResponse page = 2;
}

message GetEntryRequest {
  string entry_id = 1;
}

message GetEntryResponse {
  Entry entry = 1;
}
